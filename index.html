<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PowerPoint Webアプリ スマホで英単語練習</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#4b4c4e;font-family:"Yu Gothic UI","Yu Gothic",sans-serif}
#stage{
  position:absolute; left:50%; top:50%;
  width:min(100vw, calc(100vh * 16 / 9));
  height:min(100vh, calc(100vw * 9 / 16));
  transform:translate(-50%,-50%);
  overflow:hidden;
}
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}
#illustration{position:absolute;left:5.25%;top:19.5%;width:27%;height:43.5%;display:flex;align-items:center;justify-content:center}
#illustration img{max-width:78%;max-height:78%;object-fit:contain;filter:drop-shadow(0 0.7vw 0.7vw rgba(0,0,0,.25))}

.choice{
  position:absolute;
  top:20.1%;
  height:64.8%;
  border:0;
  padding:0;
  margin:0;
  background:#062b73;
  color:white;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  border-radius:1.0vw;
  box-shadow:0 0.35vw 0.8vw rgba(0,0,0,.18);
}
#leftChoice{left:41.1%;width:20.6%}
#rightChoice{left:71.8%;width:20.6%}
.word{font-size:clamp(28px,4.9vw,96px);font-weight:700;line-height:1;white-space:nowrap;text-shadow:0 1px 1px rgba(0,0,0,.15)}
.choice.hide-word .word{opacity:0}
.feedback{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:42%;aspect-ratio:1/1;display:none;
}
.choice.show-feedback .feedback{display:block}
.feedback svg{width:100%;height:100%;display:block}

.ctrl{
  position:absolute;border:2px solid white;border-radius:0.8vw;
  color:white;font-weight:700;cursor:pointer;
  box-shadow:0 2px 4px rgba(0,0,0,.2);
}
#retry{left:4.373%;top:69.413%;width:27.833%;height:11.173%;background:#1E4E79;font-size:clamp(24px,3.2vw,64px)}
#back{left:4.373%;top:83.747%;width:13.095%;height:11.173%;background:#FF3399;font-size:clamp(22px,2.9vw,58px)}
#next{left:19.11%;top:83.747%;width:13.095%;height:11.173%;background:#00CC99;color:#002060;font-size:clamp(22px,2.9vw,58px)}
#status{position:absolute;left:-9999px}
</style>
</head>
<body>
<div id="stage">
  <img id="bg" src="background_white_phone.png" alt="">
  <div id="illustration"></div>

  <button id="leftChoice" class="choice" aria-label="左の答え">
    <span class="word"></span>
    <span class="feedback"></span>
  </button>
  <button id="rightChoice" class="choice" aria-label="右の答え">
    <span class="word"></span>
    <span class="feedback"></span>
  </button>

  <button id="retry" class="ctrl">Try again</button>
  <button id="back" class="ctrl">Back</button>
  <button id="next" class="ctrl">Next</button>
  <div id="status" aria-live="polite"></div>
</div>

<script>
const QUESTIONS=[{"correct": "apple", "wrong": "applu", "alt": "りんご", "image": "apple.png"}, {"correct": "banana", "wrong": "bananna", "alt": "バナナ", "image": "banana.png"}, {"correct": "orange", "wrong": "orenge", "alt": "オレンジ", "image": "orange.png"}, {"correct": "grape", "wrong": "graip", "alt": "ぶどう", "image": "grape.png"}, {"correct": "bread", "wrong": "bred", "alt": "パン", "image": "bread.png"}, {"correct": "cake", "wrong": "caik", "alt": "ケーキ", "image": "cake.png"}, {"correct": "cat", "wrong": "kat", "alt": "ねこ", "image": "cat.png"}, {"correct": "dog", "wrong": "dogu", "alt": "いぬ", "image": "dog.png"}, {"correct": "bird", "wrong": "berd", "alt": "とり", "image": "bird.png"}, {"correct": "fish", "wrong": "fissh", "alt": "さかな", "image": "fish.png"}, {"correct": "rabbit", "wrong": "rabit", "alt": "うさぎ", "image": "rabbit.png"}, {"correct": "bear", "wrong": "ber", "alt": "くま", "image": "bear.png"}, {"correct": "book", "wrong": "buk", "alt": "本", "image": "book.png"}, {"correct": "pencil", "wrong": "pensil", "alt": "えんぴつ", "image": "pencil.png"}, {"correct": "eraser", "wrong": "erasor", "alt": "消しゴム", "image": "eraser.png"}, {"correct": "notebook", "wrong": "notebok", "alt": "ノート", "image": "notebook.png"}, {"correct": "bag", "wrong": "bagu", "alt": "かばん", "image": "bag.png"}, {"correct": "scissors", "wrong": "scisors", "alt": "はさみ", "image": "scissors.png"}, {"correct": "milk", "wrong": "milc", "alt": "牛乳", "image": "milk.png"}, {"correct": "juice", "wrong": "juce", "alt": "ジュース", "image": "juice.png"}, {"correct": "egg", "wrong": "eg", "alt": "たまご", "image": "egg.png"}, {"correct": "rice", "wrong": "raice", "alt": "ごはん", "image": "rice.png"}, {"correct": "pizza", "wrong": "piza", "alt": "ピザ", "image": "pizza.png"}, {"correct": "hamburger", "wrong": "hanburger", "alt": "ハンバーガー", "image": "hamburger.png"}, {"correct": "car", "wrong": "kar", "alt": "車", "image": "car.png"}, {"correct": "bus", "wrong": "bas", "alt": "バス", "image": "bus.png"}, {"correct": "train", "wrong": "trane", "alt": "電車", "image": "train.png"}, {"correct": "bicycle", "wrong": "bycycle", "alt": "自転車", "image": "bicycle.png"}, {"correct": "airplane", "wrong": "airplain", "alt": "飛行機", "image": "airplane.png"}, {"correct": "boat", "wrong": "bote", "alt": "ボート", "image": "boat.png"}, {"correct": "sun", "wrong": "san", "alt": "太陽", "image": "sun.png"}, {"correct": "moon", "wrong": "mun", "alt": "月", "image": "moon.png"}, {"correct": "star", "wrong": "ster", "alt": "星", "image": "star.png"}, {"correct": "flower", "wrong": "flouer", "alt": "花", "image": "flower.png"}, {"correct": "tree", "wrong": "tre", "alt": "木", "image": "tree.png"}, {"correct": "house", "wrong": "hause", "alt": "家", "image": "house.png"}];
const order=[...QUESTIONS].sort(()=>Math.random()-.5);
let current=0, correctSide="left", answered=false;
const sideMemory=new Map();

const left=document.getElementById("leftChoice");
const right=document.getElementById("rightChoice");
const illustration=document.getElementById("illustration");
const status=document.getElementById("status");

const smile=`<svg viewBox="0 0 200 200" aria-hidden="true">
<circle cx="100" cy="100" r="92" fill="#FFC000" stroke="#fff" stroke-width="8"/>
<path d="M55 75 L80 65 M120 65 L145 75" stroke="#002060" stroke-width="10" stroke-linecap="round"/>
<path d="M60 118 Q100 158 140 118" fill="none" stroke="#002060" stroke-width="10" stroke-linecap="round"/>
</svg>`;

const cry=`<svg viewBox="0 0 200 200" aria-hidden="true">
<circle cx="100" cy="100" r="92" fill="#FFC000" stroke="#fff" stroke-width="8"/>
<path d="M55 75 L80 85 M120 85 L145 75" stroke="#002060" stroke-width="10" stroke-linecap="round"/>
<path d="M62 142 Q100 105 138 142" fill="none" stroke="#002060" stroke-width="10" stroke-linecap="round"/>
<path d="M56 95 C42 112 42 125 56 138 C70 125 70 112 56 95Z" fill="#00CC99" stroke="#fff" stroke-width="5"/>
</svg>`;

function sizeWord(el, word){
  const n=[...word].length;
  const size = n<=5?4.9:n<=7?4.3:n<=9?3.7:n<=11?3.2:2.8;
  el.style.fontSize=`${size}vw`;
}
function clearChoice(btn){
  btn.classList.remove("hide-word","show-feedback");
  btn.querySelector(".feedback").innerHTML="";
  btn.disabled=false;
}
function render(){
  answered=false;
  const q=order[current];
  if(!sideMemory.has(current)) sideMemory.set(current,Math.random()<.5?"left":"right");
  correctSide=sideMemory.get(current);

  illustration.innerHTML=`<img src="${q.image}" alt="${q.alt}">`;

  clearChoice(left); clearChoice(right);

  const lw=correctSide==="left"?q.correct:q.wrong;
  const rw=correctSide==="right"?q.correct:q.wrong;
  left.querySelector(".word").textContent=lw;
  right.querySelector(".word").textContent=rw;
  sizeWord(left.querySelector(".word"),lw);
  sizeWord(right.querySelector(".word"),rw);
  status.textContent=`${current+1}問目`;
}
function choose(side,btn){
  if(answered)return;
  answered=true;
  const ok=side===correctSide;
  btn.classList.add("hide-word","show-feedback");
  btn.querySelector(".feedback").innerHTML=ok?smile:cry;
  left.disabled=true; right.disabled=true;
  status.textContent=ok?"正解":"不正解";
}
left.onclick=()=>choose("left",left);
right.onclick=()=>choose("right",right);
document.getElementById("retry").onclick=()=>render();
document.getElementById("next").onclick=()=>{current=(current+1)%order.length;render()};
document.getElementById("back").onclick=()=>{current=(current-1+order.length)%order.length;render()};
render();
</script>
</body>
</html>
