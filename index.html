/* Replace either SVG string below with an <img> or an animation wrapper later. */\nconst FEEDBACK_ASSETS={\n smile:`<svg viewBox=\"0 0 160 160\" aria-hidden=\"true\"><circle cx=\"80\" cy=\"80\" r=\"70\" fill=\"#FFC000\" stroke=\"#FFFFFF\" stroke-width=\"6\"/><circle cx=\"55\" cy=\"62\" r=\"9\" fill=\"#002060\"/><circle cx=\"105\" cy=\"62\" r=\"9\" fill=\"#002060\"/><path d=\"M43 91c11 31 63 31 74 0\" fill=\"none\" stroke=\"#002060\" stroke-width=\"10\" stroke-linecap=\"round\"/></svg>`,\n cry:`<svg viewBox=\"0 0 160 160\" aria-hidden=\"true\"><circle cx=\"80\" cy=\"80\" r=\"70\" fill=\"#FFC000\" stroke=\"#FFFFFF\" stroke-width=\"6\"/><path d=\"m41 59 24 8m54-8-24 8\" stroke=\"#002060\" stroke-width=\"9\" stroke-linecap=\"round\"/><path d=\"M48 116c18-26 46-26 64 0\" fill=\"none\" stroke=\"#002060\" stroke-width=\"10\" stroke-linecap=\"round\"/><path d=\"M42 75c-17 22-12 39 2 39 15 0 19-17-2-39z\" fill=\"#00CC99\" stroke=\"#FFFFFF\" stroke-width=\"4\"/></svg>`\n};\nconst shuffled=QUESTIONS.map(q=>({q,sort:Math.random()})).sort((a,b)=>a.sort-b.sort).map(x=>x.q);
let current=0,correctSide='left',answered=false;
const sideMemory=new Map();
const left=document.getElementById('leftOption'),right=document.getElementById('rightOption');
const illustration=document.getElementById('illustration'),status=document.getElementById('status'),progress=document.getElementById('progress');

function wordSize(word){
  const n=[...word].length;
  if(n<=5)return[5.25,9.33];
  if(n<=7)return[4.65,8.27];
  if(n<=9)return[4.0,7.11];
  if(n<=11)return[3.45,6.13];
  return[2.9,5.16];
}
function setWord(button,word){
  button.querySelector('.word').textContent=word;
  const [vw,vh]=wordSize(word);

function clearFeedback(button){

  button.disabled=false;

function renderQuestion({keepSide=true}={}){
  answered=false;
  const q=shuffled[current];
  if(!keepSide || !sideMemory.has(current)){
    sideMemory.set(current,Math.random()<.5?'left':'right');
  }
  correctSide=sideMemory.get(current);
  illustration.innerHTML=`<img class="question-image" src="${q.image}" alt="${q.imageAlt}">`;
  illustration.setAttribute('aria-label',q.imageAlt);
  clearFeedback(left); clearFeedback(right);
  setWord(left,correctSide==='left'?q.correct:q.incorrect);
  setWord(right,correctSide==='right'?q.correct:q.incorrect);
  progress.textContent=`${shuffled.length}問中${current+1}問目。${q.imageAlt}`;
  status.textContent='';

function choose(side,button){
  if(answered)return;
  answered=true;
  const ok=side===correctSide;
  button.classList.add('answered');
  button.setAttribute('aria-checked','true');
  const f=button.querySelector('.feedback');
  f.innerHTML=ok?FEEDBACK_ASSETS.smile:FEEDBACK_ASSETS.cry;

}
left.addEventListener('click',()=>choose('left',left));
right.addEventListener('click',()=>choose('right',right));
document.getElementById('retry').addEventListener('click',()=>renderQuestion({keepSide:true}));
document.getElementById('next').addEventListener('click',()=>{current=(current+1)%shuffled.length;renderQuestion({keepSide:true});});
document.getElementById('back').addEventListener('click',()=>{current=(current-1+shuffled.length)%shuffled.length;renderQuestion({keepSide:true});});

const viewport=document.querySelector('.viewport'),page=document.querySelector('.page');\nfunction contentHeight(){const t=page.getBoundingClientRect().top;let b=t+page.scrollHeight;page.querySelectorAll('*').forEach(el=>{if(!el.matches('.sr-only'))b=Math.max(b,el.getBoundingClientRect().bottom)});return b-t}\nfunction fitPage(){const w=viewport.clientWidth,h=viewport.clientHeight;page.style.transform='none';page.style.width=`${w}px`;if(contentHeight()<=h){page.style.width='100%';return}let lo=.2,hi=1;for(let i=0;i<12;i++){const s=(lo+hi)/2;page.style.width=`${w/s}px`;if(contentHeight()*s<=h)lo=s;else hi=s}page.style.width=`${w/lo}px`;page.style.transform=`scale(${lo})`}\nlet fitFrame;function scheduleFit(){cancelAnimationFrame(fitFrame);fitFrame=requestAnimationFrame(fitPage)}\nnew ResizeObserver(scheduleFit).observe(viewport);addEventListener('load',()=>{renderQuestion();scheduleFit()});addEventListener('resize',scheduleFit);document.fonts?.ready.then(scheduleFit);\n</script>\n</body>\n</html>"
