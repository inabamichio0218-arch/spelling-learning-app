<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=yes">
<script>
(function(){function units(){const r=document.documentElement.style;r.setProperty('--vw',innerWidth/100+'px');r.setProperty('--vh',innerHeight/100+'px')}units();addEventListener('resize',units)})();
</script>
<style>
:root{
  --vw:1vw;--vh:1vh;
  --navy:#002060;--yellow:#FFC000;--pink:#FF3399;--teal:#00CC99;--try:#1E4E79;--white:#FFFFFF;--black:#000000;
  --focus:#FFC000;
}
*,*::before,*::after{box-sizing:border-box}
html,body,.viewport{width:100%;height:100%;margin:0;overflow:hidden}
body{font-family:"游ゴシック","Yu Gothic UI",sans-serif;background:#4b4c4e;font-size:min(calc(1.25 * var(--vw)),calc(2.222 * var(--vh)))}
button{font-family:inherit;font-size:inherit}
.viewport{position:fixed;inset:0;background-color:#4b4c4e;background-image:url("background_blue_phone.png");background-size:cover;background-position:center;background-repeat:no-repeat;background-size:100% 100%;background-repeat:no-repeat;background-position:center}
.page{position:relative;width:100%;min-width:0;height:100%;min-height:0;max-width:none;margin:0;padding:0;transform-origin:top left;background:transparent}
.stage{position:relative;width:100%;height:100%;min-width:0;min-height:0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.illustration-wrap{position:absolute;left:5.25%;top:19.5%;width:27%;height:43.5%;display:flex;align-items:center;justify-content:center;pointer-events:none}
.illustration{width:min(20vw,35.55vh);height:min(20vw,35.55vh);display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 min(.55vw,.98vh) min(.75vw,1.33vh) rgba(0,0,0,.38));transition:opacity .18s ease,transform .18s ease}
.illustration svg{display:block;width:100%;height:100%;overflow:visible}
.phones{position:absolute;inset:0;pointer-events:none}
.option{position:absolute;top:17.653%;width:22.478%;height:70.386%;border:0;border-radius:0;margin:0;padding:min(1.35vw,2.4vh);background:var(--navy);color:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;pointer-events:auto;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:filter .16s ease}
.option.left{left:40.493%}.option.right{left:71.161%}
.option:hover{filter:brightness(1.12)}
.option:active{filter:brightness(.92)}
.option:focus-visible,.nav-button:focus-visible{outline:min(.31vw,.55vh) solid var(--focus);outline-offset:min(.2vw,.36vh)}
.word{max-width:100%;padding:0 .08em .12em 0;color:var(--white);font-weight:700;line-height:1.16;letter-spacing:.01em;text-align:center;overflow-wrap:normal;word-break:normal;transition:transform .22s ease;font-size:min(calc(var(--word-vw,5) * var(--vw)),calc(var(--word-vh,8.89) * var(--vh)))}
.option.answered .word{opacity:0;transform:none}
.feedback{position:absolute;left:50%;top:50%;width:min(12vw,21.33vh);height:min(12vw,21.33vh);transform:translate(-50%,-50%) scale(.55);opacity:0;transition:opacity .2s ease,transform .26s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.feedback.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.feedback svg{display:block;width:100%;height:100%}
.nav-button{position:absolute;border:min(.19vw,.34vh) solid var(--white);border-radius:min(.72vw,1.28vh);color:var(--white);font-weight:700;font-size:min(calc(3 * var(--vw)),calc(5.333 * var(--vh)));line-height:1.15;display:flex;align-items:center;justify-content:center;margin:0;padding:0 .25em;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;box-shadow:0 min(.18vw,.32vh) min(.28vw,.5vh) rgba(0,0,0,.18);transition:filter .15s ease,transform .12s ease}
.nav-button:hover{filter:brightness(1.1)}.nav-button:active{filter:brightness(.9);transform:translateY(min(.12vw,.21vh))}
#retry{left:4.373%;top:69.413%;width:27.833%;height:11.173%;background:var(--try)}
#back{left:4.373%;top:83.747%;width:13.095%;height:11.173%;background:var(--pink)}
#next{left:19.11%;top:83.747%;width:13.095%;height:11.173%;background:var(--teal);color:var(--navy)}
.info-button{position:absolute;right:1.2%;top:1.2%;width:min(2.5vw,4.44vh);height:min(2.5vw,4.44vh);border:min(.12vw,.21vh) solid var(--white);border-radius:50%;background:var(--try);color:var(--white);font-size:min(calc(1.45 * var(--vw)),calc(2.58 * var(--vh)));font-weight:700}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s;animation-iteration-count:1;scroll-behavior:auto;transition-duration:.001s}}
@media (forced-colors:active){.option,.nav-button,.info-button{forced-color-adjust:none;background:ButtonFace;color:ButtonText;border-color:ButtonText}.option:focus-visible,.nav-button:focus-visible{outline-color:Highlight}.feedback{forced-color-adjust:none}.word{color:ButtonText}}

.illustration img.question-image{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

/* v5: white phone background + perfectly matched blue screens */
.option{
  width:24.9%;
  height:70.3%;
  top:17.6%;
  background:#062b73;
}
#leftOption{ left:40.45%; }
#rightOption{ left:71.15%; }

.option .word{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  height:100%;
  margin:0;
}


/* v6: exact screen fit measured from the original PowerPoint phone screens */
.option{
  top:18.04% !important;
  width:22.50% !important;
  height:69.51% !important;
  padding:0 !important;
}
#leftOption{
  left:40.10% !important;
}
#rightOption{
  left:70.85% !important;
}


/* v7: keep background and clickable screens in the SAME coordinate system */
.option{
  top:17.9% !important;
  width:22.6% !important;
  height:69.8% !important;
  padding:0 !important;
  background:#062b73 !important;
}
#leftOption{ left:40.1% !important; }
#rightOption{ left:70.75% !important; }

.page{
  width:100% !important;
  height:100% !important;
  transform:none !important;
}


/* v8: blue phone screens are baked into the background image */
.option{
  top:16.7111% !important;
  height:77.9556% !important;
  padding:0 !important;
  background:transparent !important;
  border:0 !important;
}
#leftOption{
  left:39.40% !important;
  width:23.85% !important;
}
#rightOption{
  left:70.05% !important;
  width:24.05% !important;
}
.option:hover,
.option:active{
  filter:none !important;
}

</style>
</head>
<body>
<div class="viewport">
<main class="page">
<section class="stage" role="group" aria-label="英単語スペル練習">
  <h1 class="sr-only">PowerPoint Webアプリ　スマホで英単語練習</h1>
  <div class="illustration-wrap" role="group" aria-label="問題イラスト">
    <div id="illustration" class="illustration" role="img" aria-label=""></div>
  </div>
  <div class="phones" role="radiogroup" aria-label="正しい英単語を選んでください">
    <button id="leftOption" class="option left" type="button" role="radio" aria-checked="false" aria-posinset="1" aria-setsize="2"><span class="word"></span><span class="feedback" aria-hidden="true"></span></button>
    <button id="rightOption" class="option right" type="button" role="radio" aria-checked="false" aria-posinset="2" aria-setsize="2"><span class="word"></span><span class="feedback" aria-hidden="true"></span></button>
  </div>
  <button id="retry" class="nav-button" type="button">Try again</button>
  <button id="back" class="nav-button" type="button">Back</button>
  <button id="next" class="nav-button" type="button">Next</button>
  <button id="infoButton" class="info-button" type="button" hidden aria-label="この教材について">i</button>
  <p id="progress" class="sr-only" aria-live="polite"></p>
  <p id="status" class="sr-only" role="status" aria-live="assertive"></p>
</section>
</main>
</div>
<script>
/* Add future questions by appending {illustration, imageAlt, correct, incorrect}. */
const QUESTIONS=[
  {"imageAlt": "りんごの3Dイラスト", "correct": "apple", "incorrect": "applu", "image": "apple.png"},
  {"imageAlt": "バナナの3Dイラスト", "correct": "banana", "incorrect": "bananna", "image": "banana.png"},
  {"imageAlt": "オレンジの3Dイラスト", "correct": "orange", "incorrect": "orenge", "image": "orange.png"},
  {"imageAlt": "ぶどうの3Dイラスト", "correct": "grape", "incorrect": "graip", "image": "grape.png"},
  {"imageAlt": "パンの3Dイラスト", "correct": "bread", "incorrect": "bred", "image": "bread.png"},
  {"imageAlt": "ケーキの3Dイラスト", "correct": "cake", "incorrect": "caik", "image": "cake.png"},
  {"imageAlt": "ねこの3Dイラスト", "correct": "cat", "incorrect": "kat", "image": "cat.png"},
  {"imageAlt": "いぬの3Dイラスト", "correct": "dog", "incorrect": "dogu", "image": "dog.png"},
  {"imageAlt": "とりの3Dイラスト", "correct": "bird", "incorrect": "berd", "image": "bird.png"},
  {"imageAlt": "さかなの3Dイラスト", "correct": "fish", "incorrect": "fissh", "image": "fish.png"},
  {"imageAlt": "うさぎの3Dイラスト", "correct": "rabbit", "incorrect": "rabit", "image": "rabbit.png"},
  {"imageAlt": "くまの3Dイラスト", "correct": "bear", "incorrect": "ber", "image": "bear.png"},
  {"imageAlt": "本の3Dイラスト", "correct": "book", "incorrect": "buk", "image": "book.png"},
  {"imageAlt": "えんぴつの3Dイラスト", "correct": "pencil", "incorrect": "pensil", "image": "pencil.png"},
  {"imageAlt": "消しゴムの3Dイラスト", "correct": "eraser", "incorrect": "erasor", "image": "eraser.png"},
  {"imageAlt": "ノートの3Dイラスト", "correct": "notebook", "incorrect": "notebok", "image": "notebook.png"},
  {"imageAlt": "かばんの3Dイラスト", "correct": "bag", "incorrect": "bagu", "image": "bag.png"},
  {"imageAlt": "はさみの3Dイラスト", "correct": "scissors", "incorrect": "scisors", "image": "scissors.png"},
  {"imageAlt": "牛乳の3Dイラスト", "correct": "milk", "incorrect": "milc", "image": "milk.png"},
  {"imageAlt": "ジュースの3Dイラスト", "correct": "juice", "incorrect": "juce", "image": "juice.png"},
  {"imageAlt": "たまごの3Dイラスト", "correct": "egg", "incorrect": "eg", "image": "egg.png"},
  {"imageAlt": "ごはんの3Dイラスト", "correct": "rice", "incorrect": "raice", "image": "rice.png"},
  {"imageAlt": "ピザの3Dイラスト", "correct": "pizza", "incorrect": "piza", "image": "pizza.png"},
  {"imageAlt": "ハンバーガーの3Dイラスト", "correct": "hamburger", "incorrect": "hanburger", "image": "hamburger.png"},
  {"imageAlt": "車の3Dイラスト", "correct": "car", "incorrect": "kar", "image": "car.png"},
  {"imageAlt": "バスの3Dイラスト", "correct": "bus", "incorrect": "bas", "image": "bus.png"},
  {"imageAlt": "電車の3Dイラスト", "correct": "train", "incorrect": "trane", "image": "train.png"},
  {"imageAlt": "自転車の3Dイラスト", "correct": "bicycle", "incorrect": "bycycle", "image": "bicycle.png"},
  {"imageAlt": "飛行機の3Dイラスト", "correct": "airplane", "incorrect": "airplain", "image": "airplane.png"},
  {"imageAlt": "ボートの3Dイラスト", "correct": "boat", "incorrect": "bote", "image": "boat.png"},
  {"imageAlt": "太陽の3Dイラスト", "correct": "sun", "incorrect": "san", "image": "sun.png"},
  {"imageAlt": "月の3Dイラスト", "correct": "moon", "incorrect": "mun", "image": "moon.png"},
  {"imageAlt": "星の3Dイラスト", "correct": "star", "incorrect": "ster", "image": "star.png"},
  {"imageAlt": "花の3Dイラスト", "correct": "flower", "incorrect": "flouer", "image": "flower.png"},
  {"imageAlt": "木の3Dイラスト", "correct": "tree", "incorrect": "tre", "image": "tree.png"},
  {"imageAlt": "家の3Dイラスト", "correct": "house", "incorrect": "hause", "image": "house.png"}
];
/* Replace either SVG string below with an <img> or an animation wrapper later. */
const FEEDBACK_ASSETS={
 smile:`<svg viewBox="0 0 160 160" aria-hidden="true"><circle cx="80" cy="80" r="70" fill="#FFC000" stroke="#FFFFFF" stroke-width="6"/><circle cx="55" cy="62" r="9" fill="#002060"/><circle cx="105" cy="62" r="9" fill="#002060"/><path d="M43 91c11 31 63 31 74 0" fill="none" stroke="#002060" stroke-width="10" stroke-linecap="round"/></svg>`,
 cry:`<svg viewBox="0 0 160 160" aria-hidden="true"><circle cx="80" cy="80" r="70" fill="#FFC000" stroke="#FFFFFF" stroke-width="6"/><path d="m41 59 24 8m54-8-24 8" stroke="#002060" stroke-width="9" stroke-linecap="round"/><path d="M48 116c18-26 46-26 64 0" fill="none" stroke="#002060" stroke-width="10" stroke-linecap="round"/><path d="M42 75c-17 22-12 39 2 39 15 0 19-17-2-39z" fill="#00CC99" stroke="#FFFFFF" stroke-width="4"/></svg>`
};
const shuffled=QUESTIONS.map(q=>({q,sort:Math.random()})).sort((a,b)=>a.sort-b.sort).map(x=>x.q);
let current=0,correctSide='left',answered=false;
const sideMemory=new Map();
const left=document.getElementById('leftOption'),right=document.getElementById('rightOption');
const illustration=document.getElementById('illustration'),status=document.getElementById('status'),progress=document.getElementById('progress');

function wordSize(word){
  const n=[...word].length;
  if(n<=5)return[5.25,9.33];
  if(n<=7)return[4.65,8.27];
  if(n<=9)return[4.0,7.11];
  if(n<=11)return[3.45,6.13];
  return[2.9,5.16];
}
function setWord(button,word){
  button.querySelector('.word').textContent=word;
  const [vw,vh]=wordSize(word);
  button.style.setProperty('--word-vw',vw);
  button.style.setProperty('--word-vh',vh);
  button.dataset.word=word;
}
function clearFeedback(button){
  button.classList.remove('answered');
  const f=button.querySelector('.feedback');
  f.classList.remove('show');
  f.innerHTML='';
  button.setAttribute('aria-checked','false');
  button.disabled=false;
}
function renderQuestion({keepSide=true}={}){
  answered=false;
  const q=shuffled[current];
  if(!keepSide || !sideMemory.has(current)){
    sideMemory.set(current,Math.random()<.5?'left':'right');
  }
  correctSide=sideMemory.get(current);

  illustration.innerHTML=`<img class="question-image" src="${q.image}" alt="${q.imageAlt}">`;
  illustration.setAttribute('aria-label',q.imageAlt);

  clearFeedback(left); clearFeedback(right);
  setWord(left,correctSide==='left'?q.correct:q.incorrect);
  setWord(right,correctSide==='right'?q.correct:q.incorrect);

  progress.textContent=`${shuffled.length}問中${current+1}問目。${q.imageAlt}`;
  status.textContent='';
  scheduleFit();
}
function choose(side,button){
  if(answered)return;
  answered=true;
  const ok=side===correctSide;
  button.classList.add('answered');
  button.setAttribute('aria-checked','true');

  const f=button.querySelector('.feedback');
  f.innerHTML=ok?FEEDBACK_ASSETS.smile:FEEDBACK_ASSETS.cry;
  f.setAttribute('role','img');
  f.setAttribute('aria-label',ok?'正解のニコニコ顔':'不正解の泣き顔');
  requestAnimationFrame(()=>f.classList.add('show'));

  left.disabled=true;
  right.disabled=true;
  status.textContent=ok?'正解です。Nextで次の問題へ進めます。':'ちがいます。Try againで、もう一度挑戦できます。';
  scheduleFit();
}
left.addEventListener('click',()=>choose('left',left));
right.addEventListener('click',()=>choose('right',right));

document.getElementById('retry').addEventListener('click',()=>renderQuestion({keepSide:true}));
document.getElementById('next').addEventListener('click',()=>{
  current=(current+1)%shuffled.length;
  renderQuestion({keepSide:true});
});
document.getElementById('back').addEventListener('click',()=>{
  current=(current-1+shuffled.length)%shuffled.length;
  renderQuestion({keepSide:true});
});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){
    e.preventDefault();
    document.getElementById('next').click();
  }else if(e.key==='ArrowLeft'){
    e.preventDefault();
    document.getElementById('back').click();
  }
});
const viewport=document.querySelector('.viewport'),page=document.querySelector('.page');
function contentHeight(){const t=page.getBoundingClientRect().top;let b=t+page.scrollHeight;page.querySelectorAll('*').forEach(el=>{if(!el.matches('.sr-only'))b=Math.max(b,el.getBoundingClientRect().bottom)});return b-t}
function fitPage(){page.style.width='100%';page.style.transform='none'}
let fitFrame;function scheduleFit(){cancelAnimationFrame(fitFrame);fitFrame=requestAnimationFrame(fitPage)}
new ResizeObserver(scheduleFit).observe(viewport);addEventListener('load',()=>{renderQuestion();scheduleFit()});addEventListener('resize',scheduleFit);document.fonts?.ready.then(scheduleFit);
</script>
</body>
</html>
